[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-editor"
version = "0.1.0"
description = "Editor de escritorio para crear y editar animaciones con Manim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manim Editor contributors" }]
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
manim-editor = "manim_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]
